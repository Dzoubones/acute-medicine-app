name: iOS verification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/regenerate-ios
    paths:
      - '.github/workflows/ios-verify.yml'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'docs/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ios-verify.yml'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'docs/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Unsigned iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets and Capacitor plugins
        run: npm run ios:sync

      - name: Run local feature and release-safety tests
        run: npm test

      - name: Verify App Store identity and version
        shell: bash
        run: |
          set -euo pipefail
          project='ios/App/App.xcodeproj/project.pbxproj'
          config='ios/App/App/capacitor.config.json'

          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = uk.acutemedicine.acutemedicaltake;' "$project"
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = uk.acutemedicine.acutemedicaltake.widgets;' "$project"
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = uk.acutemedicine.acutemedicaltake.watch;' "$project"
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = uk.acutemedicine.acutemedicaltake.watch.extension;' "$project"
          test "$(grep -Fc 'MARKETING_VERSION = 1.0.0;' "$project")" -eq 8
          test "$(grep -Fc 'CURRENT_PROJECT_VERSION = 2;' "$project")" -eq 8
          ! grep -Fq '<string>armv7</string>' ios/App/App/Info.plist

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(
            readFileSync('ios/App/App/capacitor.config.json', 'utf8')
          );

          if (config.appId !== 'uk.acutemedicine.acutemedicaltake') {
            throw new Error(`Unexpected iOS app ID: ${config.appId}`);
          }

          if (config.server?.url) {
            throw new Error(`Production must use bundled assets, not server.url: ${config.server.url}`);
          }
          NODE

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AcuteMedicalTakeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify compiled app metadata and architectures
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/AcuteMedicalTakeDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'uk.acutemedicine.acutemedicaltake'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = '1.0.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = '2'
          ! /usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$app/Info.plist" 2>/dev/null | grep -Fq armv7
          lipo -info "$app/App"

      - name: Compile WidgetKit target
        run: |
          xcodebuild -project ios/App/App.xcodeproj -target AMTWidgets -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

      - name: Compile watchOS target
        run: |
          xcodebuild -project ios/App/App.xcodeproj -target AMTWatch -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build
