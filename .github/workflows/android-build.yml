name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build installable debug APK
        run: gradle -p android assembleDebug

      - name: Build release App Bundle
        run: gradle -p android bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: acute-medical-take-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: acute-medical-take-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
